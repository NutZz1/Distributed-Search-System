# Server Configuration
server.port=8080

# Application Name
spring.application.name=query-router

# Helix Configuration
helix.cluster.name=SearchCluster
helix.zookeeper.address=localhost:2181

# Logging Configuration
logging.level.root=INFO
logging.level.com.distributedsearch.router=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# HTTP Client Configuration
spring.mvc.async.request-timeout=10000
